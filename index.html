<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3f22">
  <link rel="manifest" href="manifest.json">
  <title>Last Hit Kingdom</title>
  <link rel="stylesheet" href="styles.css?v=0.3.0">
</head>
<body>
  <section id="title-screen" class="title-screen">
    <div class="title-card">
      <span class="title-crown">♛</span>
      <p class="title-kicker">판타지 영토 정복 보드게임</p>
      <h1>Last Hit<br><b>Kingdom</b></h1>
      <p class="title-copy">병력을 모으고 영토를 정복해 왕국의 마지막 왕이 되세요.</p>
      <div class="setup-box">
        <div class="setup-heading"><h2>새 게임 설정</h2><label>플레이어 수 <select id="player-count"><option value="2">2명</option><option value="3">3명</option><option value="4" selected>4명</option></select></label></div>
        <div id="player-setup" class="player-setup"></div>
        <p id="balance-hint" class="balance-hint"></p>
        <div class="mode-legend"><span>👤 사람(로컬)</span><span>🤖 AI</span><span>🌐 사람(온라인) <small>준비 중</small></span></div>
        <button id="start-game" class="start-game">모험 시작</button>
      </div>
    </div>
  </section>
  <main id="app">
    <header class="topbar">
      <div><span class="eyebrow">판타지 영토 정복 보드게임</span><h1>⚜ Last Hit Kingdom</h1></div>
      <button id="new-game" class="secondary">새 게임</button>
    </header>
    <section id="player-cards" class="player-cards" aria-label="플레이어 현황"></section>
    <section class="game-layout">
      <div id="board" class="board" aria-label="왕국 보드">
        <section id="boss-center" class="boss-center"></section>
      </div>
      <aside id="log-panel" class="log-panel">
        <button id="log-toggle" class="log-toggle">📜 모험 기록 <span>펼치기</span></button>
        <ol id="log"></ol>
      </aside>
    </section>
    <section id="action-panel" class="action-panel" aria-live="polite"></section>
  </main>
  <div id="modal-root"></div>
  <script type="module" src="js/main.js?v=0.3.0"></script>
</body>
</html>
